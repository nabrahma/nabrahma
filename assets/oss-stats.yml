name: refresh open-source stats

on:
  schedule:
    # every day at 04:17 UTC — off the hour so it isn't queued behind the crowd
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets/oss.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: nabrahma
        run: python scripts/gen_oss_svg.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/oss.svg
          git diff --staged --quiet || git commit -m "chore: refresh open-source stats"
          git push
