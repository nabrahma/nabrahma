<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-label="nabaskar brahma — backend, distributed systems, infrastructure security">
  <style>
    :root { color-scheme: dark light; }
    .bg    { fill: #0d1117; }
    .frame { fill: none; stroke: #30363d; stroke-width: 1; }
    .dot   { fill: #30363d; }
    .name  { font: 700 40px ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; fill: #ffffff; letter-spacing: 2px; }
    .sub   { font: 400 15px ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; fill: #8b949e; letter-spacing: 1px; }
    .cmd   { font: 400 14px ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; fill: #c9d1d9; }
    .muted { font: 400 14px ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; fill: #6e7681; }

    @media (prefers-color-scheme: light) {
      .bg    { fill: #ffffff; }
      .frame { stroke: #d0d7de; }
      .dot   { fill: #d0d7de; }
      .name  { fill: #1f2328; }
      .sub   { fill: #656d76; }
      .cmd   { fill: #1f2328; }
      .muted { fill: #8c959f; }
    }

    /* cursor blinks and travels with the typed line */
    .cursor { animation: blink 1.05s steps(1) infinite, caret 3.5s linear infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes caret {
      0%   { transform: translateX(0) }
      24%  { transform: translateX(432px) }
      94%  { transform: translateX(432px) }
      100% { transform: translateX(0) }
    }

    /* typed line reveal — each line wipes in, holds, then the next follows */
    .type { animation: wipe 14s linear infinite; }
    @keyframes wipe {
      0%    { width: 0 }
      6%    { width: 470px }
      30%   { width: 470px }
      33%   { width: 0 }
      100%  { width: 0 }
    }
    #l1 { animation-delay: 0s; }
    #l2 { animation-delay: 3.5s; }
    #l3 { animation-delay: 7s; }
    #l4 { animation-delay: 10.5s; }

    /* scanning sweep across the rule */
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(0);   opacity: 0 }
      15%  { opacity: 1 }
      85%  { opacity: 1 }
      100% { transform: translateX(700px); opacity: 0 }
    }

    /* slow pulse on the status dot */
    .live { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  </style>

  <rect class="bg" width="860" height="220" rx="10"/>
  <rect class="frame" x="0.5" y="0.5" width="859" height="219" rx="10"/>

  <!-- window chrome -->
  <circle class="dot" cx="26" cy="26" r="5"/>
  <circle class="dot" cx="44" cy="26" r="5"/>
  <circle class="dot" cx="62" cy="26" r="5"/>
  <text class="muted" x="84" y="31" font-size="12">~/nabrahma</text>

  <!-- name -->
  <text class="name" x="30" y="88">nabaskar brahma</text>
  <text class="sub"  x="32" y="112">backend · distributed systems · infrastructure security</text>

  <!-- animated rule with sweep -->
  <line x1="30" y1="130" x2="830" y2="130" stroke="#30363d" stroke-width="1"/>
  <g class="sweep">
    <rect x="30" y="129" width="110" height="2" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- terminal lines: each masked by a growing rect -->
  <g>
    <clipPath id="c1"><rect id="l1" class="type" x="52" y="146" height="18" width="0"/></clipPath>
    <clipPath id="c2"><rect id="l2" class="type" x="52" y="146" height="18" width="0"/></clipPath>
    <clipPath id="c3"><rect id="l3" class="type" x="52" y="146" height="18" width="0"/></clipPath>
    <clipPath id="c4"><rect id="l4" class="type" x="52" y="146" height="18" width="0"/></clipPath>

    <text class="muted" x="30" y="160">$</text>
    <g clip-path="url(#c1)"><text class="cmd" x="52" y="160">go build ./... &amp;&amp; kubectl apply -f driftcheck.yaml</text></g>
    <g clip-path="url(#c2)"><text class="cmd" x="52" y="160">seccomp: compiled 1 filter per tool, by subtraction</text></g>
    <g clip-path="url(#c3)"><text class="cmd" x="52" y="160">soak: 5,388,510 events · 0 dropped · 13 goroutines</text></g>
    <g clip-path="url(#c4)"><text class="cmd" x="52" y="160">detection 84.6% · false positives 25-50% (published)</text></g>
    <rect class="cursor" x="54" y="148" width="8" height="14" fill="#8b949e"/>
  </g>

  <!-- status strip -->
  <g transform="translate(30,192)">
    <circle class="live" cx="4" cy="-4" r="4" fill="#3fb950"/>
    <text class="muted" x="18" y="0">systems online</text>
    <text class="muted" x="150" y="0">·</text>
    <text class="muted" x="170" y="0">go · python · kubernetes · seccomp</text>
    <text class="muted" x="470" y="0">·</text>
    <text class="muted" x="490" y="0">0 claims without caveats</text>
  </g>
</svg>
