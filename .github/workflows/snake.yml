name: generate contribution snake

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: nabrahma
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#ffffff
            dist/snake-light.svg?palette=github-light&color_snake=#1f2328

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
